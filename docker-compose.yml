services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      TEMPORAL_ADDRESS: temporal:7233
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml

  temporal-ui:
    image: temporalio/ui:2.37.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  # ── Local LLM (optional) ───────────────────────────────────────────────────
  # Start with: docker compose --profile local-llm up -d
  # Exposes an OpenAI-compatible endpoint at http://localhost:11434/v1 and a web
  # UI at http://localhost:3000. Requires an NVIDIA GPU plus the NVIDIA Container
  # Toolkit; remove the `deploy` block to run CPU-only (much slower).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped

  # One-shot helper that pulls the default models once Ollama is reachable.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do echo 'waiting for ollama...'; sleep 2; done;
        ollama pull SpeakLeash/bielik-11b-v3.0-instruct:Q8_0;
        ollama pull bbaranow/pllum-12B-q4_k_m;
        echo 'models ready'
    restart: "no"

  # Web chat UI for Ollama (http://localhost:3000).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["local-llm"]
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "false"
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  temporal-db:
  ollama-models:
  open-webui:
