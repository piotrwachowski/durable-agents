[project]
name = "durable-agents"
version = "0.1.0"
description = "A DeepAgents-style framework for building durable, multi-agent systems on Temporal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Piotr Wachowski" },
]
keywords = [
    "temporal",
    "durable-execution",
    "ai-agents",
    "llm",
    "openai",
    "multi-agent",
    "deepagents",
    "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "temporalio>=1.7.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/piotrwachowski/durable-agents"
Repository = "https://github.com/piotrwachowski/durable-agents"
Issues = "https://github.com/piotrwachowski/durable-agents/issues"
Changelog = "https://github.com/piotrwachowski/durable-agents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durable_agents"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Intentionally un-idiomatic legacy code used as input for the
# code-archaeologist example — not subject to linting.
extend-exclude = ["examples/03_code_archaeologist/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

